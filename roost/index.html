<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: chat column + right panel (Listings / Map / Checklist / Agreement) that opens after the first search. Dark-first slate with a marigold "To-Let" accent. */
:root{
  --bg:#12161a; --surface:#181d22; --raised:#21272e; --hover:#2a3139; --line:#333b45; --line-soft:#252c33;
  --fg:#e8ecef; --muted:#9aa4ae; --faint:#69737e;
  --accent:#f0b23f; --accent-ink:#1b1406; --good:#7cc79a; --warn:#f0925f; --info:#86b6ea;
  --water:#1d3448; --park:#1b2c24; --road:#2e3640; --block:#1c2227;
  --art-l1:30%; --art-l2:16%; --art-ink:80%; --art-sat:38%;
  --shadow:0 18px 50px -20px rgba(0,0,0,.75);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --pw:56%;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f1; --surface:#ffffff; --raised:#eaece7; --hover:#e1e4dd; --line:#d5d9d0; --line-soft:#e6e9e3;
    --fg:#151a1e; --muted:#59616a; --faint:#8b939b;
    --accent:#a96a00; --accent-ink:#ffffff; --good:#23784a; --warn:#b4511f; --info:#2b67a6;
    --water:#cfe1ee; --park:#dbe9dc; --road:#ffffff; --block:#e7e9e3;
    --art-l1:92%; --art-l2:82%; --art-ink:32%; --art-sat:38%;
    --shadow:0 18px 50px -24px rgba(20,30,40,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f1; --surface:#ffffff; --raised:#eaece7; --hover:#e1e4dd; --line:#d5d9d0; --line-soft:#e6e9e3;
  --fg:#151a1e; --muted:#59616a; --faint:#8b939b;
  --accent:#a96a00; --accent-ink:#ffffff; --good:#23784a; --warn:#b4511f; --info:#2b67a6;
  --water:#cfe1ee; --park:#dbe9dc; --road:#ffffff; --block:#e7e9e3;
  --art-l1:92%; --art-l2:82%; --art-ink:32%; --art-sat:38%;
  --shadow:0 18px 50px -24px rgba(20,30,40,.35);
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--fg)}
.app{display:flex;height:100%;position:relative}

/* chat */
.chat{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:52px}
.wordmark{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.wordmark .logo{width:22px;height:22px;color:var(--accent)}
.thread-title{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40ch}
.topbar .spacer{flex:1}
.toplink{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;color:var(--muted)}
.toplink:hover{background:var(--hover);color:var(--fg)}
.count{font-family:var(--f-mono);font-size:11px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0 5px}
.count[data-n="0"]{background:var(--raised);color:var(--faint)}

.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 16px 10vh}
.started .hero{display:none}
.tolet{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);padding:3px 9px;border-radius:4px;transform:rotate(-2deg)}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,4.6vw,46px);line-height:1.05;letter-spacing:-.025em;margin:0;text-align:center;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.hero .slot{width:min(700px,100%)}
.suggest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(700px,100%)}
.suggest button{text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:flex-start;transition:background .15s,color .15s,border-color .15s}
.suggest button:hover{background:var(--raised);color:var(--fg);border-color:var(--faint)}
.suggest button b{display:block;color:var(--fg);font-weight:500;font-size:13.5px}
.suggest .ico{margin-top:2px;color:var(--accent)}

.thread{flex:1;overflow-y:auto;display:none;padding:12px 16px 24px}
.started .thread{display:block}
.thread-inner{width:min(720px,100%);margin:0 auto;display:flex;flex-direction:column;gap:22px}
.msg-user{align-self:flex-end;max-width:min(80%,520px);background:var(--raised);border-radius:14px 14px 4px 14px;padding:9px 14px;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .3s ease both}
.msg-ai{display:flex;flex-direction:column;gap:12px;animation:rise .35s ease both;min-width:0}
.trace{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:13px}
.trace .ico{width:14px;height:14px}
.ai-text{font-size:15.5px;line-height:1.6;max-width:65ch}
.ai-text p{margin:0 0 .6em}.ai-text p:last-child{margin:0}
.ai-text b{font-weight:600}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.thinking .logo{width:20px;height:20px;color:var(--accent);animation:bob 1s ease-in-out infinite alternate}
.next{display:flex;flex-wrap:wrap;gap:6px}
.next button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.next button:hover{color:var(--fg);border-color:var(--faint);background:var(--raised)}
.next button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}

.placecard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;max-width:460px}
.placecard .pin{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);flex:none}
.placecard div{min-width:0}
.placecard strong{display:block;font-weight:600}
.placecard span{color:var(--muted);font-size:13px}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.checks i{font-style:normal;font-size:11.5px;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.checks i.q{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.options{display:flex;flex-direction:column;gap:6px;max-width:460px}
.options button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.options button:hover{background:var(--raised);border-color:var(--faint)}
.options button span{color:var(--muted);font-size:12.5px;display:block}
.options .ico{color:var(--accent)}

.result-card{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;max-width:460px;text-align:left}
.result-card:hover{border-color:var(--faint)}
.result-card .stack{display:flex;flex:none}
.result-card .stack .art{width:40px;height:40px;border-radius:9px;border:2px solid var(--surface);margin-left:-12px}
.result-card .stack .art:first-child{margin-left:0}
.result-card .stack .art svg{width:24px;height:24px}
.result-card .meta{flex:1;min-width:0}
.result-card strong{display:block;font-weight:600}
.result-card .meta span{color:var(--muted);font-size:12.5px}
.pill-btn{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:8px;background:var(--raised);font-size:13px;flex:none}
.mini-table{border-collapse:collapse;font-size:13px;width:100%;max-width:460px}
.mini-table td{padding:6px 0;border-bottom:1px solid var(--line-soft)}
.mini-table td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* composer */
.dock{padding:0 16px 12px;display:none}
.started .dock{display:block}
.dock .slot{width:min(720px,100%);margin:0 auto}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px 16px;display:flex;flex-direction:column;gap:8px}
.composer:focus-within{border-color:var(--faint);box-shadow:var(--shadow)}
.composer textarea{background:transparent;border:0;outline:0;resize:none;color:var(--fg);font:inherit;font-size:15px;line-height:1.5;min-height:48px;max-height:160px;padding:2px 0}
.started .composer textarea{min-height:24px}
.composer textarea::placeholder{color:var(--faint)}
.composer .row{display:flex;align-items:center;gap:4px}
.composer .row .spacer{flex:1}
.send{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--raised);color:var(--faint)}
.send.ready{background:var(--accent);color:var(--accent-ink)}
.send .ico{width:16px;height:16px;stroke-width:2.2}
.places{display:flex;align-items:center;gap:6px;padding:8px 4px 0;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}
.place-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:var(--raised);color:var(--fg)}
.place-chip .ico{width:13px;height:13px;color:var(--accent)}
.place-chip em{font-style:normal;color:var(--muted)}
.add-place{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.add-place:hover{color:var(--fg);border-color:var(--faint)}
.add-place .ico{width:13px;height:13px}
.disclaim{text-align:center;color:var(--faint);font-size:12px;padding-top:6px}

/* panel */
.panel{width:0;flex:none;height:100%;overflow:hidden;position:relative;background:var(--surface);border-left:1px solid transparent;transition:width .55s cubic-bezier(.2,.8,.2,1),border-color .3s}
.split .panel{width:var(--pw);border-left-color:var(--line)}
.split.expanded .panel{width:100%}
.split.expanded .chat{display:none}
.dragging .panel{transition:none}
.panel-inner{position:absolute;inset:0;display:flex;flex-direction:column;min-width:380px}
.handle{position:absolute;left:-7px;top:0;bottom:0;width:14px;cursor:col-resize;z-index:5;display:none;place-items:center}
.split .handle{display:grid}
.handle::after{content:"";width:4px;height:40px;border-radius:2px;background:var(--line)}
.handle:hover::after,.dragging .handle::after{background:var(--accent)}
.p-head{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button{height:32px;padding:0 11px;border-radius:8px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13.5px}
.tabs button:hover{background:var(--hover);color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--fg)}
.tabs .ico{width:15px;height:15px}
.tabs .prog{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.p-body{flex:1;overflow-y:auto;min-height:0;position:relative}
.p-sub{display:flex;align-items:center;gap:10px;padding:14px 18px 0;flex-wrap:wrap}
.p-sub h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.015em;margin:0;flex:1;min-width:0}
.p-sub h2 span{color:var(--faint);font-family:var(--f-mono);font-size:12px;font-weight:400;letter-spacing:0;margin-left:6px}
.sort{appearance:none;background:var(--raised);border:0;font-size:13px;height:30px;border-radius:8px;padding:0 28px 0 10px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 10px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.chips{display:flex;gap:6px;padding:12px 18px 2px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:13px;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.anchor-note{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding:8px 18px 0}
.anchor-note .ico{width:14px;height:14px;color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:14px 18px 40px}
.card{position:relative;display:flex;flex-direction:column;border-radius:14px;background:var(--bg);border:1px solid var(--line-soft);overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s;animation:rise .45s ease both;animation-delay:calc(var(--i,0)*50ms)}
.card:hover{transform:translateY(-2px);border-color:var(--line)}
.card .art{aspect-ratio:16/10;max-width:100%}
.card .art svg{width:30%}
.kind{position:absolute;top:10px;left:10px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface);letter-spacing:.02em}
.heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);backdrop-filter:blur(6px)}
.heart[aria-pressed="true"]{color:var(--accent)}
.heart[aria-pressed="true"] .ico{fill:currentColor}
.heart .ico{width:16px;height:16px}
.card-body{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.loc{color:var(--muted);font-size:12.5px}
.cfg{font-size:12.5px;color:var(--muted)}
.commute{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--info)}
.commute .ico{width:14px;height:14px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--raised);color:var(--muted)}
.tag.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.money{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.rent{font-family:var(--f-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.rent small{font-size:11px;color:var(--faint);font-weight:400}
.dep{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.each{font-size:12px;color:var(--good);margin-left:auto}
.skel{border-radius:14px;background:var(--bg);border:1px solid var(--line-soft);overflow:hidden}
.skel div{background:linear-gradient(90deg,var(--raised),var(--hover),var(--raised));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.skel .a{aspect-ratio:16/10}.skel .b{height:12px;margin:14px 12px 8px;border-radius:4px;width:70%}.skel .c{height:10px;margin:0 12px 8px;border-radius:4px;width:45%}.skel .d{height:14px;margin:8px 12px 14px;border-radius:4px;width:35%}
.art{display:grid;place-items:center;background:radial-gradient(120% 100% at 25% 15%,hsl(var(--h) var(--art-sat) var(--art-l1)),hsl(var(--h) calc(var(--art-sat) - 12%) var(--art-l2)))}
.art svg{fill:none;stroke:hsl(var(--h) 50% var(--art-ink));stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* map */
.mapwrap{padding:14px 18px 30px;display:flex;flex-direction:column;gap:12px}
.map{width:100%;max-width:100%;aspect-ratio:1;max-height:70vh;border-radius:14px;border:1px solid var(--line-soft);background:var(--block)}
.map text{font-family:var(--f-body)}
.map .pin{cursor:pointer}
.map .pin:hover rect,.map .pin:focus rect{fill:var(--accent)}
.map .pin:hover text,.map .pin:focus text{fill:var(--accent-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* detail */
.detail{padding:14px 18px 40px;display:flex;flex-direction:column;gap:20px;animation:fade .3s ease both}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;height:28px;padding:0 8px 0 4px;border-radius:7px}
.back:hover{background:var(--hover);color:var(--fg)}
.d-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
.d-top .art{aspect-ratio:4/3;border-radius:14px;max-width:100%}
.d-top .art svg{width:34%}
.d-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.d-info h2{font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn-accent{height:38px;padding:0 16px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn-accent:disabled{opacity:.5;cursor:default}
.ghost{height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);font-size:13.5px;white-space:nowrap}
.ghost:hover{background:var(--hover)}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.cost{display:flex;flex-direction:column;gap:7px}
.cost-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}
.cost-row span:first-child{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cost-row b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.cost-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:600}
.cost-total b{font-family:var(--f-mono);font-weight:500}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.bul li{display:flex;gap:10px;font-size:14px}
.bul li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--good);margin-top:.5em}
.bul.w li::before{background:var(--warn)}
.bul.n li::before{background:var(--faint)}
.mates{display:flex;gap:8px;flex-wrap:wrap}
.mate{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--raised);font-size:13px}
.mate i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:hsl(var(--h) 40% 45%);color:#fff;font-style:normal;font-size:11px;font-weight:600}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot-btn{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;text-align:left}
.slot-btn span{display:block;color:var(--faint);font-size:11.5px}
.slot-btn:hover{border-color:var(--faint)}
.slot-btn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* checklist */
.cl{padding:16px 18px 40px;display:flex;flex-direction:column;gap:20px}
.cl-head{display:flex;flex-direction:column;gap:8px}
.meter{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);transition:width .4s ease}
.cl-group h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.cl-group h3 span{font-family:var(--f-mono);font-weight:400;color:var(--faint)}
.cl-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line-soft);margin-bottom:6px;cursor:pointer;transition:background .15s}
.cl-item:hover{background:var(--raised)}
.cl-item input{appearance:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);flex:none;margin:1px 0 0;display:grid;place-items:center;cursor:pointer}
.cl-item input:checked{background:var(--good);border-color:var(--good)}
.cl-item input:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.cl-item div{min-width:0}
.cl-item strong{font-weight:500;display:block}
.cl-item span{color:var(--muted);font-size:12.5px}
.cl-item.done strong{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.cl-item .auto{font-size:11px;color:var(--good);margin-left:6px;font-weight:500;text-decoration:none}

/* agreement */
.ag{padding:16px 18px 40px;display:flex;flex-direction:column;gap:22px}
.ag-head h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
.ag-head p{margin:0;color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--raised);color:var(--muted)}
.steps span.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:14px;width:100%;min-width:0}
.field input:focus{border-color:var(--accent);outline:0}
.fees{border:1px solid var(--line-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fees .r{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.fees .r span:first-child{color:var(--muted)}
.fees .r b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.fees .t{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.fees small{color:var(--faint);font-size:12px}
.doc{background:var(--bg);border:1px solid var(--line-soft);border-radius:12px;padding:22px 24px;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.65;max-height:420px;overflow-y:auto}
.doc h4{text-align:center;margin:0 0 4px;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.doc .sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 16px}
.doc ol{padding-left:20px;margin:0}
.doc li{margin-bottom:8px}
.doc mark{background:color-mix(in srgb,var(--accent) 20%,transparent);color:inherit;padding:0 3px;border-radius:3px}

.pop{position:absolute;top:50px;right:12px;width:min(340px,calc(100vw - 32px));background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;z-index:20;display:flex;flex-direction:column;gap:10px;animation:rise .2s ease both}
.pop h4{margin:0;font-weight:600}
.pop .line{display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:8px;padding:2px}
.pop .line:hover{background:var(--hover)}
.pop .line .art{width:38px;height:38px;border-radius:8px;flex:none}
.pop .line .art svg{width:22px;height:22px}
.pop .line div{flex:1;min-width:0;font-size:13px}
.pop .line div span{display:block;color:var(--faint);font-family:var(--f-mono);font-size:12px}
.pop .empty{color:var(--muted);font-size:13px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@media (max-width:860px){
  .panel{position:fixed;inset:0;width:100% !important;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:10;border:0;padding-top:env(safe-area-inset-top,0px)}
  .split .panel{transform:none}
  .split .handle,.expand-btn{display:none !important}
  .panel-inner{min-width:0}
  .d-top{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding-inline:14px}
  .suggest{grid-template-columns:1fr}
  .thread-title{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>

/* ---------------- geo + scoring ---------------- */
function commute(l){
  const a = S.anchor; if (!a || a.area !== l.area) return null;
  const d = Math.hypot(l.x - a.x, l.y - a.y) * 1.3;
  if (d <= 1.4) return {mins:Math.max(3, Math.round(d * 13)), mode:'walk', km:d};
  return {mins:Math.round(6 + d * 4.5), mode:'auto', km:d};
}
function monthly(l){
  const food = l.food ? 0 : 4500, wifi = (l.kind === 'PG' || l.kind === 'Co-living') ? 0 : 400;
  return {rent:l.rent, maint:l.maint, elec:l.elec, food, wifi, total:l.rent + l.maint + l.elec + food + wifi};
}
function share(l){ return l.beds ? l.beds : 1; }
function score(l){
  const c = commute(l); const per = monthly(l).total / share(l);
  return -(c ? c.mins : 20) * 1.3 - per / 1200 + (l.bach === 'verified' ? 5 : l.bach === 'ask' ? -6 : 0) - l.warn.length * 2 - (l.brok ? 3 : 0);
}
function visible(){
  const f = S.filter, q = S.q;
  let list = S.base.filter(l => {
    if (f.nobrok && l.brok) return false;
    if (f.food && !l.food) return false;
    if (f.verified && l.bach !== 'verified') return false;
    return true;
  });
  const sorts = {match:(a,b) => score(b) - score(a), rent:(a,b) => a.rent / share(a) - b.rent / share(b), commute:(a,b) => (commute(a)?.mins ?? 99) - (commute(b)?.mins ?? 99), deposit:(a,b) => a.dep / a.rent - b.dep / b.rent};
  return list.sort(sorts[S.sort]);
}

/* ---------------- parsing ---------------- */
function matchPlace(t){ return PLACES.find(p => p.re.test(t)); }
function parseSearch(t){
  const q = {};
  if (/\bpg\b|paying guest|hostel/.test(t)) q.kind = 'PG';
  else if (/co-?living/.test(t)) q.kind = 'Co-living';
  else if (/shared|flatmate|room in|roommate/.test(t)) q.kind = 'Shared flat';
  else if (/\b1\s?rk\b|studio|\b[123]\s?bhk\b|whole|entire|independent|own flat/.test(t)) q.kind = 'Whole flat';
  if (/\bgirls?\b|women|female|ladies/.test(t)) q.gender = 'Girls';
  else if (/\bboys?\b|\bmen\b|\bmale\b|gents/.test(t)) q.gender = 'Boys';
  const m = t.match(/(?:under|below|less than|within|upto|up to|max|budget(?: of| is)?|<)\s*(?:rs\.?|₹|inr)?\s*([\d,]+(?:\.\d+)?)\s*(k\b)?/);
  if (m) q.budget = Math.round(parseFloat(m[1].replace(/,/g,'')) * (m[2] ? 1000 : 1));
  const fr = t.match(/(\d|two|three|four)\s+(friends|people|of us)/);
  if (fr) q.people = ({two:2,three:3,four:4})[fr[1]] || +fr[1];
  if (/no[\s-]?broker|without broker|zero broker/.test(t)) q.nobrok = true;
  if (/food|meals|tiffin/.test(t)) q.food = true;
  return q;
}
function isAddress(t){
  return /\b(my|our)\s+(?:(?:home|flat|house|office|college|hostel|campus|workplace|work|university|institute)\s+)?(?:address\s*)?(is|:|at)\b|\bi\s+(live|stay|work|study)\s+(at|in|near)|^save\b|\bpin\s*code\b/.test(t)
    || (/\b[1-9]\d{5}\b/.test(t) && !/find|show|search|pg|flat|room|rent/.test(t));
}
function labelFor(t, p){
  if (/college|university|campus|study|institute|iit|hostel/.test(t) || p?.kind === 'College') return 'College';
  if (/office|work/.test(t)) return 'Office';
  return 'Home';
}

/* ---------------- chat ---------------- */
const thread = $('#threadInner');
function addUser(text){ const d = document.createElement('div'); d.className = 'msg-user'; d.textContent = text; thread.append(d); scrollDown(); }
function addAI(){ const d = document.createElement('div'); d.className = 'msg-ai'; thread.append(d); scrollDown(); return d; }
function scrollDown(){ const t = $('#thread'); requestAnimationFrame(() => t.scrollTo({top:t.scrollHeight, behavior:reduced ? 'auto' : 'smooth'})); }
async function think(el, steps){
  el.innerHTML = '<div class="thinking"><svg class="logo"><use href="#logo"/></svg><span class="step"></span></div>';
  const s = el.querySelector('.step');
  for (const st of steps){ s.textContent = st; await wait(600); }
}
const trace = t => `<div class="trace">${t} ${ICON.chev}</div>`;
const next = items => `<div class="next">${items.map(([txt, primary]) => `<button class="${primary ? 'primary' : ''}" data-say="${esc(txt)}">${esc(txt)}</button>`).join('')}</div>`;

async function send(raw){
  const text = raw.trim();
  if (!text || S.busy) return;
  S.busy = true;
  $('#input').value = ''; autosize(); syncSend();
  if (!S.started) start();
  addUser(text);
  $('#threadTitle').textContent = S.anchor ? 'Near ' + S.anchor.name : text;
  const el = addAI();
  const t = text.toLowerCase();
  try {
    if (isAddress(t)) await handleAddress(el, t, text);
    else if (/agreement|lease|leave and licen/.test(t)) await handleAgreementAsk(el);
    else if (/checklist|what (should|to) (i )?check|before paying|before i pay/.test(t)) await handleChecklistAsk(el);
    else if (/police verification/.test(t)) await canned(el, 'police');
    else if (/movers|packers|shift(ing)? my/.test(t)) await canned(el, 'movers');
    else if (/split|share (the )?costs?/.test(t)) await canned(el, 'split');
    else await handleSearch(el, t);
  } finally { S.busy = false; scrollDown(); }
}

async function handleAddress(el, t, raw){
  await think(el, ['Reading the address', 'Matching locality and pincode']);
  const pinM = t.match(/\b[1-9]\d{5}\b/);
  const place = matchPlace(t);
  const pinPlace = pinM && PINS[pinM[0]] ? placeById(PINS[pinM[0]]) : null;
  const label = labelFor(t, place || pinPlace);
  const street = raw.replace(/^.*?\b(is|at|in|near|:)\s+/i, '').trim();
  if (place && (!pinM || (pinPlace && pinPlace.area === place.area))){
    return savePlace(el, place, label, [ 'Locality matched', pinM ? 'Pincode matches' : 'Pincode added: ' + place.pin ], street);
  }
  if (!place && pinPlace){
    return savePlace(el, pinPlace, label, ['Pincode matched', 'Locality filled in'], street);
  }
  if (place && pinPlace && pinPlace.area !== place.area){
    el.innerHTML = `<div class="ai-text"><p>The pincode ${pinM[0]} belongs to <b>${pinPlace.name}</b>, but you also mentioned <b>${place.name}</b>. Which one should I save as your ${label.toLowerCase()}?</p></div>` + optionsHTML([place, pinPlace], label, street);
    return;
  }
  const hint = place ? `I found <b>${place.name}</b>, but pincode ${pinM[0]} doesn't match it.` : `I couldn't place "${esc(street.slice(0, 60))}" on the map.`;
  const opts = place ? [place] : [placeById('iitb'), placeById('kora'), placeById('hinj1')];
  el.innerHTML = `<div class="ai-text"><p>${hint} Did you mean one of these? If not, send the full address with the area name and pincode.</p></div>` + optionsHTML(opts, label, street);
}
function optionsHTML(opts, label, street){
  return `<div class="options">${opts.map(p => `<button data-place="${p.id}" data-label="${label}" data-street="${esc(street)}">${ICON.pin}<div>${esc(p.name)}<span>${esc(p.sub)}</span></div></button>`).join('')}</div>`;
}
function savePlace(el, p, label, checks, street){
  const saved = Object.assign({}, p, {label, street});
  S.places = S.places.filter(x => x.label !== label).concat(saved);
  S.anchor = saved; renderPlaces();
  const verb = label === 'College' ? 'near my college' : label === 'Office' ? 'near my office' : 'near home';
  el.innerHTML = trace('Checked locality and pincode') +
    `<div class="placecard"><div class="pin">${ICON.pin}</div><div><strong>${esc(p.name)}</strong><span>${esc(p.sub)} · saved as ${label}</span><div class="checks">${checks.map(c => `<i>${c}</i>`).join('')}</div></div></div>` +
    `<div class="ai-text"><p>Saved. Every listing will now show the walk or auto time to ${esc(p.name)}.</p></div>` +
    next([[`Find a PG ${verb}`, true], [`Shared flats ${verb} under ₹20k`], [`Whole flat for 2 friends ${verb}`]]);
  if (S.base.length) renderPanel();
}

async function handleSearch(el, t){
  const q = parseSearch(t);
  const place = matchPlace(t);
  const mine = t.match(/near (my|our) (college|office|work|home|place|campus|university)/);
  let anchor = null;
  if (place) anchor = S.places.find(p => p.id === place.id) || Object.assign({}, place, {label:'Area'});
  else if (mine){
    const want = /college|campus|university/.test(mine[2]) ? 'College' : /office|work/.test(mine[2]) ? 'Office' : 'Home';
    anchor = S.places.find(p => p.label === want);
    if (!anchor){
      await think(el, ['Looking for your saved places']);
      el.innerHTML = `<div class="ai-text"><p>I don't have your ${want.toLowerCase()} saved yet. What's the address? A name and pincode is enough.</p></div>` +
        next([['My college is IIT Bombay, Powai 400076', true], ['My office is in Koramangala 5th Block, 560095'], ['I work at Hinjewadi Phase 1, Pune']]);
      return;
    }
  }
  const hasSearchWords = q.kind || q.gender || q.people || /find|show|search|looking|need|want|room|flat|pg|place|stay|rent|nearby|near/.test(t);
  const refine = !anchor && !q.kind && S.base.length && (q.budget || q.nobrok || q.food || q.gender || /cheap|closer|nearest|verified|bachelor/.test(t));
  if (!anchor && !refine){
    if (!hasSearchWords || !(S.anchor || S.places.length)){
      await think(el, ['Understanding what you need']);
      el.innerHTML = `<div class="ai-text"><p>Where will you be spending your days? Tell me your college or office and I'll show places with real commute times. In this demo I cover Powai (IIT Bombay), Koramangala and Hinjewadi.</p></div>` +
        next([['Find a PG near IIT Bombay under ₹15k', true], ['Shared flat in Koramangala'], ['My college is IIT Bombay, Powai 400076']]);
      return;
    }
    anchor = S.anchor;
  }

  if (refine){
    Object.assign(S.q, q);
    if (q.nobrok) S.filter.nobrok = true;
    if (q.food) S.filter.food = true;
    if (/verified|bachelor/.test(t)) S.filter.verified = true;
    if (/cheap/.test(t)) S.sort = 'rent';
    if (/closer|nearest/.test(t)) S.sort = 'commute';
    S.base = pool();
    await think(el, ['Refining your results']);
  } else {
    S.anchor = anchor; S.area = anchor.area; S.q = q; S.sort = 'match';
    S.filter = {nobrok:!!q.nobrok, food:!!q.food, verified:false}; S.detail = null; S.tab = 'list';
    S.base = pool();
    if (q.budget) tick(['budget']);
    await think(el, ['Understanding what you need', `Searching ${AREAS[S.area].name} for ${q.kind ? KIND_PL[q.kind] : 'PGs, shared and whole flats'}`, `Working out commute times to ${anchor.name}`, 'Checking deposits, brokerage and bachelor rules']);
  }
  $('#threadTitle').textContent = 'Near ' + S.anchor.name;
  openPanel(!refine);
  const list = visible();
  if (!list.length){
    el.innerHTML = `<div class="ai-text"><p>Nothing matches all of that near ${esc(S.anchor.name)}. Try a higher budget or a different type of place.</p></div>` + next([['Show everything nearby', true], ['Shared flats instead']]);
    return;
  }
  const best = list.slice().sort((a,b) => score(b) - score(a))[0];
  const cheap = list.slice().sort((a,b) => monthly(a).total / share(a) - monthly(b).total / share(b))[0];
  const risky = list.find(l => l.warn.length && (l.dep / l.rent >= 4 || l.bach === 'ask'));
  const c = commute(best);
  const what = q.kind ? KIND_PL[q.kind] : 'places';
  let body = `<p>I found <b>${list.length} ${refine ? 'places' : what}</b> near ${esc(S.anchor.name)}${S.q.budget ? ' under ' + inr(S.q.budget) : ''}. Best fit: <b>${esc(best.name)}</b> in ${esc(best.loc.split(',')[0])}, ${c ? c.mins + ' min ' + (c.mode === 'walk' ? 'walk' : 'by auto') : 'nearby'}, ${inr(best.rent)} a month${best.food ? ' with meals' : ''}.</p>`;
  if (cheap !== best) body += `<p>Cheapest overall is <b>${esc(cheap.name)}</b> at about ${inr(monthly(cheap).total / share(cheap))} a month${share(cheap) > 1 ? ' each' : ''} once you add food and bills.</p>`;
  if (risky) body += `<p>Be careful with <b>${esc(risky.name)}</b> (${esc(risky.loc.split(',')[0])}): ${esc(risky.warn[0].charAt(0).toLowerCase() + risky.warn[0].slice(1))}.</p>`;
  if (!refine) body += `<p>I've started a move-in checklist for you in the panel. It ticks itself off as we go.</p>`;
  el.innerHTML = trace(refine ? 'Refined results' : `Checked ${list.length * 7 + 11} listings, kept ${list.length}`) + `<div class="ai-text">${body}</div>` + resultCard(list) +
    next([['Only no-brokerage places'], ['With food included'], ['Show them on a map', true]]);
}
const KIND_PL = {'PG':'PGs','Shared flat':'shared flats','Whole flat':'whole flats','Co-living':'co-living spaces'};
function pool(){
  const q = S.q;
  return L.filter(l => l.area === S.area)
    .filter(l => !q.kind || l.kind === q.kind || (q.people && l.beds))
    .filter(l => !q.gender || l.gender === q.gender || l.gender === 'Any')
    .filter(l => !q.budget || l.rent / share(l) <= q.budget * 1.05)
    .filter(l => !q.people || !l.beds || l.beds >= q.people);
}
function resultCard(list){
  return `<button class="result-card" data-open="list"><div class="stack">${list.slice(0,3).map(art).join('')}</div><div class="meta"><strong>${list.length} places near ${esc(S.anchor.name)}</strong><span>From ${inr(Math.min(...list.map(l => l.rent / share(l))))} a month · ${list.filter(l => l.bach === 'verified').length} confirmed bachelor-friendly</span></div><span class="pill-btn">View</span></button>`;
}

async function handleChecklistAsk(el){
  await think(el, ['Pulling up your checklist']);
  S.tab = 'check'; S.detail = null; openPanel(false);
  const left = CHECK.flatMap(g => g.items).filter(i => !S.checks[i[0]]);
  el.innerHTML = `<div class="ai-text"><p>${left.length} things left on your checklist. The ones people most often regret skipping: <b>getting the society NOC for bachelors</b>, <b>checking water pressure on the visit</b> and <b>registering the agreement before paying the deposit</b>.</p></div>`;
}
async function handleAgreementAsk(el){
  if (!S.final){
    await think(el, ['Checking your shortlist']);
    el.innerHTML = `<div class="ai-text"><p>Happy to. Which place is it for? Open a listing and tap <b>Finalise this place</b>, and I'll fill in the agreement from its details.</p></div>`;
    return;
  }
  await think(el, ['Opening your draft']);
  S.tab = 'deal'; S.detail = null; openPanel(false);
  el.innerHTML = `<div class="ai-text"><p>Your draft for <b>${esc(S.final.name)}</b> is open in the panel. Check the dates and amounts, then send it to ${esc(S.final.owner)} for e-sign.</p></div>`;
}
const CANNED = {
  police:l => `<p>Here's how to file the tenant police verification for ${esc(l ? l.loc : 'your new place')}:</p><p>1. Get the owner's consent and a copy of their ID.<br>2. Fill the tenant form on your state police citizen portal with your Aadhaar and a photo.<br>3. Upload the signed agreement. Approval usually takes 7–10 days.</p><p>I've added it to your checklist. Want a reminder once the agreement is signed?</p>`,
  movers:() => `<p>Three movers can do a single-room shift this week (sample quotes):</p><table class="mini-table"><tr><td>ShiftEasy · 1 tempo, 2 helpers</td><td>₹3,800</td></tr><tr><td>BoxBuddy · includes packing</td><td>₹5,200</td></tr><tr><td>CampusMove · student rate</td><td>₹2,900</td></tr></table><p>For a PG or a single room you can usually manage with an auto-tempo and one helper.</p>`,
  split:l => { if (!l) return '<p>Finalise a place first and I\'ll split the costs.</p>'; const m = monthly(l), n = share(l) > 1 ? share(l) : (l.mates ? l.mates.length + 1 : 1); return `<p>Here's a fair monthly split for ${esc(l.name)}${n > 1 ? ' across ' + n + ' people' : ''}:</p><table class="mini-table"><tr><td>Rent (your share)</td><td>${inr(l.beds ? l.rent / l.beds : l.rent)}</td></tr><tr><td>Maintenance</td><td>${inr(m.maint / n)}</td></tr><tr><td>Electricity (estimate)</td><td>${inr(m.elec / n)}</td></tr><tr><td>Wi-Fi</td><td>${inr(m.wifi / n)}</td></tr><tr><td>Food</td><td>${inr(m.food)}</td></tr></table><p>Set up a shared expense group and add the electricity bill when it arrives each month.</p>`; }
};
async function canned(el, key){
  await think(el, ['Working on it']);
  el.innerHTML = `<div class="ai-text">${CANNED[key](S.final)}</div>`;

function start(){

    await wait(was ? 350 : 650);
  }
  renderPanel();
}
function closePanel(){ $('#app').classList.remove('split','expanded'); }
function syncTabs(){

/* agreement */
function agreementState(){
  const l = S.final, a = S.agree;
  return {owner:a.owner ?? l.owner, tenant:a.tenant ?? '', start:a.start ?? '2026-11-01', months:+(a.months ?? 11), rent:+(a.rent ?? (l.beds ? l.rent : l.rent)), dep:+(a.dep ?? l.dep), lock:+(a.lock ?? 3), notice:+(a.notice ?? 1), split:a.split ?? 'half'};
}
function fees(st){
  const l = S.final, mh = AREAS[l.area].state === 'MH';
  let stamp, reg;
  if (mh){ stamp = Math.max(100, Math.ceil((0.0025 * (st.rent * st.months + st.dep * 0.10 * st.months / 12)) / 100) * 100); reg = 1000; }
  else { stamp = Math.min(500, Math.ceil(0.01 * (st.rent * 12 + st.dep))); reg = 0; }
  return {stamp, reg, svc:499, total:stamp + reg + 499, mh};
}

/* ---------------- finalise / visit ---------------- */
async function finalise(l){
  S.final = l; S.sent = false; S.agree = {};
  const ticks = [];
  if (l.dep / l.rent <= 3) ticks.push('deposit');
  if (!l.brok) ticks.push('brokerage');
  if (l.bach === 'verified') ticks.push('bach');
  ticks.push('budget'); tick(ticks);
  renderPanel();
  if (innerWidth <= 860) closePanel();
  S.busy = true;
  addUser(`Let's go with ${l.name} in ${l.loc.split(',')[0]}`);
  const el = addAI();
  await think(el, ['Pulling the listing details', 'Preparing your agreement']);
  const mh = AREAS[l.area].state === 'MH';
  const warn = l.bach !== 'verified' ? `<p>One thing first: the society hasn't confirmed bachelors are allowed. Get that NOC in writing before you pay anything.</p>` : '';
  el.innerHTML = `<div class="ai-text"><p>Good choice. Next step: <b>let's get your rent agreement sorted</b> before you pay the ${inr(l.dep)} deposit.</p>${warn}<p>${mh ? 'In Maharashtra a leave and licence agreement has to be registered. It can be done online with Aadhaar e-sign, and a biometric agent can come to the flat, so neither of you visits an office.' : 'In Karnataka an 11-month rental agreement only needs e-stamp paper. Registration is optional.'} I've drafted one from the listing. Add your name and check the dates.</p></div>` +
    next([['Open the agreement', true], ['What should I check before paying?'], ['Split costs with flatmates']]);
  S.busy = false; scrollDown();
}
async function bookVisit(l, slot){
  S.visits[l.id] = slot; renderDetail();
  if (innerWidth <= 860) closePanel();
  S.busy = true;
  addUser(`Book a visit to ${l.name}, ${slot}`);
  const el = addAI();
  await think(el, ['Messaging ' + l.owner]);
  el.innerHTML = trace('Visit request sent') + `<div class="ai-text"><p>Visit requested with ${esc(l.owner)} for <b>${slot}</b>. I'll confirm when they reply.</p><p>On the visit, check the six items under <b>On the visit</b> in your checklist: water pressure, phone signal, damp, house rules, flatmates and the electricity meter.</p></div>` +
    next([['Open my checklist', true], ['Show other places nearby']]);
  S.busy = false; scrollDown();
}

/* ---------------- misc + wiring ---------------- */
let tt;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
function autosize(){ const i = $('#input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 160) + 'px'; }
function syncSend(){ $('#send').classList.toggle('ready', !!$('#input').value.trim()); }
function renderPlaces(){
  $('#places').innerHTML = (S.places.length ? S.places.map(p => `<span class="place-chip">${ICON.pin}<em>${p.label}</em>${esc(p.name)}</span>`).join('') : '<span>No saved places yet</span>') +
    `<button class="add-place" id="addPlace"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Save a place</button>`;
}
function fill(t){ $('#input').value = t; autosize(); syncSend(); $('#input').focus(); }

const SUGGEST = [
  ['Find a PG near IIT Bombay under ₹15k', 'Commute times, meals, curfews'],
  ['My college is IIT Bombay, Powai 400076', 'Save your college once, use it everywhere'],
  ['Shared flat in Koramangala, no brokerage', 'Meet the flatmates before you visit'],
  ['My office address is near the big mall', 'See how Roost asks when an address is unclear']
];
$('#suggest').innerHTML = SUGGEST.map(([a, b]) => `<button data-say="${esc(a)}">${ICON.pin}<span><b>${esc(a)}</b>${esc(b)}</span></button>`).join('');
renderPlaces(); syncProg();

document.addEventListener('click', e => {
  const say = e.target.closest('[data-say]');
  if (say){
    const t = say.dataset.say;
    if (t === 'Open the agreement'){ S.tab = 'deal'; S.detail = null; openPanel(false); return; }
    if (t === 'Open my checklist'){ S.tab = 'check'; S.detail = null; openPanel(false); return; }
    if (t === 'Show them on a map'){ S.tab = 'map'; S.detail = null; openPanel(false); return; }
    return send(t);
  }
  if (!e.target.closest('#shortPop') && !e.target.closest('#shortBtn')) $('#shortPop').hidden = true;
});
$('#places').addEventListener('click', e => { if (e.target.closest('#addPlace')) fill('My college is '); });
$('#input').addEventListener('input', () => { autosize(); syncSend(); });
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send($('#input').value); } });
$('#send').addEventListener('click', () => send($('#input').value));
$('#attach').addEventListener('click', () => toast('Upload a screenshot of a listing from any site and Roost checks it for red flags'));
$('#newChat').addEventListener('click', () => location.reload());
$('#closePanel').addEventListener('click', closePanel);
$('#expand').addEventListener('click', () => $('#app').classList.toggle('expanded'));
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.dataset.tab; S.detail = null; renderPanel(); });

thread.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o){ S.tab = 'list'; S.detail = null; openPanel(false); return; }
  const p = e.target.closest('[data-place]');
  if (p){
    const place = placeById(p.dataset.place);
    p.closest('.options').querySelectorAll('button').forEach(b => b.disabled = true);
    S.busy = true;
    addUser(place.name + ', ' + place.sub);
    const el = addAI();
    think(el, ['Saving']).then(() => { savePlace(el, place, p.dataset.label, ['Confirmed by you', 'Pincode ' + place.pin], p.dataset.street); S.busy = false; scrollDown(); });
  }
});

$('#pBody').addEventListener('click', e => {
  const t = e.target;
  const h = t.closest('[data-heart]'); if (h){ e.stopPropagation(); return toggleShort(h.dataset.heart); }
  const f = t.closest('[data-f]'); if (f){ S.filter[f.dataset.f] = !S.filter[f.dataset.f]; return renderPanel(); }
  if (t.closest('#back')){ S.detail = null; return renderPanel(); }
  if (t.closest('#finalise')){ const l = byId(S.detail); if (S.final?.id !== l.id) finalise(l); return; }
  if (t.closest('#askAbout')){ const l = byId(S.detail); if (innerWidth <= 860) closePanel(); return fill(`Is ${l.name} in ${l.loc.split(',')[0]} a good deal?`); }
  const sl = t.closest('[data-slot]'); if (sl){ return bookVisit(byId(S.detail), sl.dataset.slot); }
  if (t.closest('#sendAgree')){
    const st = agreementState();
    if (!st.tenant.trim()){ toast('Add your name as it appears on Aadhaar first'); $('#ag-tenant').focus(); return; }
    S.sent = true; tick(['agreement', 'notice']); renderPanel();
    if (innerWidth <= 860) closePanel();
    S.busy = true; const el = addAI();
    think(el, ['Sending to ' + st.owner]).then(() => {
      el.innerHTML = trace('Agreement sent for e-sign') + `<div class="ai-text"><p>Sent to <b>${esc(st.owner)}</b> for Aadhaar e-sign. Once they sign, ${fees(st).mh ? 'the biometric agent books a slot to register it, usually within 2 days' : 'you both get a signed copy by email'}.</p><p>While you wait, here's what's left before move-in day.</p></div>` +
        next([['Start police verification', true], ['Find movers for 1 Nov'], ['Split costs with flatmates'], ['Open my checklist']]);
      S.busy = false; scrollDown();
    });
    return;
  }
  if (t.closest('#docsList')){ return toast('You: Aadhaar, PAN, 2 photos. Owner: Aadhaar, PAN, Index II or tax bill'); }
  const pin = t.closest('.pin'); if (pin){ S.detail = pin.dataset.id; return renderPanel(); }
  const card = t.closest('.card'); if (card){ S.detail = card.dataset.id; return renderPanel(); }
});
$('#pBody').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sort'){ S.sort = t.value; return renderPanel(); }
  if (t.dataset.check){ S.checks[t.dataset.check] = t.checked; S.autoChecks.delete(t.dataset.check); saveChecks(); return renderPanel(); }
  if (t.dataset.ag === 'tenant' || t.dataset.ag === 'owner') return;
  if (t.dataset.ag){ S.agree[t.dataset.ag] = t.type === 'checkbox' ? (t.checked ? 'half' : 'full') : t.value; const y = $('#pBody').scrollTop; renderPanel(); $('#pBody').scrollTop = y; }
});
$('#pBody').addEventListener('input', e => {
  const k = e.target.dataset.ag; if (k !== 'tenant' && k !== 'owner') return;
  S.agree[k] = e.target.value;
  const m = document.querySelector(`[data-bind="${k}"]`); if (m) m.textContent = e.target.value || (k === 'tenant' ? 'Your full name' : '');
});
$('#pBody').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const c = e.target.closest('.card, .pin'); if (c && c === e.target){ S.detail = c.dataset.id; renderPanel(); }
});
$('#shortBtn').addEventListener('click', () => { const p = $('#shortPop'); p.hidden = !p.hidden; if (!p.hidden) renderShort(); });
$('#shortPop').addEventListener('click', e => { const g = e.target.closest('[data-goto]'); if (!g) return; const l = byId(g.dataset.goto); $('#shortPop').hidden = true; if (S.area !== l.area) return toast('Search ' + AREAS[l.area].name + ' to open this one'); S.detail = l.id; openPanel(false); });

const handle = $('#handle');
handle.addEventListener('pointerdown', e => {
  handle.setPointerCapture(e.pointerId); $('#app').classList.add('dragging');
  const move = ev => document.documentElement.style.setProperty('--pw', Math.max(380, Math.min(innerWidth - 380, innerWidth - ev.clientX)) + 'px');
  const up = () => { $('#app').classList.remove('dragging'); handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); };
  handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up);
});
handle.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const w = $('#panel').getBoundingClientRect().width + (e.key === 'ArrowLeft' ? 40 : -40);
  document.documentElement.style.setProperty('--pw', Math.max(380, Math.min(innerWidth - 380, w)) + 'px');
});
</script>
</body>
</html>
